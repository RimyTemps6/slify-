<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe6fa">
<title>Slify</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header>
    <h1>Slify</h1>
    <button id="btnKey" class="ghost">Chave da API</button>
  </header>
  <nav>
    <button data-tab="new" class="on">Novidades</button>
    <button data-tab="search">Buscar</button>
    <button data-tab="favs">Favoritos</button>
    <button data-tab="hist">Histórico</button>
  </nav>
  <main id="view"></main>

  <footer id="player">
    <img id="pCover" alt="">
    <div class="meta"><b id="pTitle">Nada tocando</b><span id="pArtist">Escolha uma música</span></div>
    <button id="pFav" class="ico" aria-label="Favoritar">♡</button>
    <button id="pPrev" class="ico" aria-label="Anterior">⏮</button>
    <button id="pPlay" class="ico big" aria-label="Tocar">▶</button>
    <button id="pNext" class="ico" aria-label="Próxima">⏭</button>
    <input id="pBar" type="range" min="0" max="1000" value="0" aria-label="Progresso">
  </footer>
</div>
<dialog id="dlg">
  <h2>Chave da API do YouTube</h2>
  <p>Com a chave, o Slify toca a música inteira. Sem ela, toca prévias de 30 segundos. A chave fica salva só neste aparelho.</p>
  <input id="keyIn" type="password" placeholder="Cole a chave aqui" autocomplete="off">
  <div class="acts"><button id="keySave" class="primary">Salvar</button><button id="keyDel" class="ghost">Remover</button><button id="keyClose" class="ghost">Agora não</button></div>
</dialog>
<div id="yt"></div>
<script type="module" src="app.js"></script>
</body>
</html>
