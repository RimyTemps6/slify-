<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe6fa">
<title>Slify</title>
<script>try{if(localStorage.getItem("slify_theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" hidden>
  <h1>Slify</h1>
  <p>Entre com sua conta Google para guardar seus favoritos e seu histórico.</p>
  <button id="btnLogin" class="primary">Entrar com Google</button>
  <p id="loginMsg"></p>
</section>
<div id="app">
  <aside>
    <h1>Slify</h1>
    <nav>
      <button data-tab="new" class="on"><i>⌂</i><span>Novidades</span></button>
      <button data-tab="search"><i>⌕</i><span>Buscar</span></button>
      <button data-tab="favs"><i>♥</i><span>Favoritos</span></button>
      <button data-tab="hist"><i>↺</i><span>Histórico</span></button>
      <button id="btnKey"><i>⚙</i><span>Ajustes</span></button>
      <button id="btnTheme"><i>◐</i><span>Modo escuro</span></button>
    </nav>
  </aside>
  <main id="view"></main>

  <footer id="player">
    <input id="pBar" class="bar" type="range" min="0" max="1000" value="0" aria-label="Progresso">
    <div class="mini" id="openFull">
      <img id="pCover" alt="">
      <div class="meta"><b id="pTitle">Nada tocando</b><span id="pArtist">Escolha uma música</span></div>
    </div>
    <button class="ico fv" aria-label="Favoritar">♡</button>
    <button class="ico pv hide-m" aria-label="Anterior">⏮</button>
    <button class="ico big pp" aria-label="Tocar">▶</button>
    <button class="ico nx hide-m" aria-label="Próxima">⏭</button>
    <button class="ico dl hide-m" aria-label="Baixar">⤓</button>
  </footer>
</div>

<section id="full" hidden>
  <div id="fBg"></div>
  <button id="fClose" class="ico" aria-label="Fechar">⌄</button>
  <img id="fCover" alt="">
  <div class="fmeta">
    <div><b id="fTitle"></b><span id="fArtist"></span></div>
    <button class="ico fv" aria-label="Favoritar">♡</button>
  </div>
  <input id="fBar" class="bar" type="range" min="0" max="1000" value="0" aria-label="Progresso">
  <div class="times"><span id="fCur">0:00</span><span id="fDur">0:00</span></div>
  <div class="ctrl">
    <button class="ico pv" aria-label="Anterior">⏮</button>
    <button class="ico big pp" aria-label="Tocar">▶</button>
    <button class="ico nx" aria-label="Próxima">⏭</button>
  </div>
  <button class="dlbtn dl">⤓ Baixar música</button>
</section>

<dialog id="dlg">
  <h2>Ajustes</h2>
  <p>Conta: <b id="who"></b> <button id="btnOut" class="ghost">Sair</button></p>
  <h2 style="font-size:16px">Chave da API do YouTube</h2>
  <p>Com a chave, o Slify toca a música inteira. Sem ela, toca prévias de 30 segundos. Depois de salvar, ela fica guardada.</p>
  <input id="keyIn" type="password" placeholder="Cole a chave aqui" autocomplete="off">
  <div class="acts"><button id="keySave" class="primary">Salvar</button><button id="keyDel" class="ghost">Remover</button><button id="keyClose" class="ghost">Agora não</button></div>
</dialog>
<div id="toast" hidden></div>
<div id="yt"></div>
<script type="module" src="app.js"></script>
</body>
</html>
